[package]
name = "tosi"
version = "0.0.1"
edition = "2021"
description = "Tosi engine in Rust"
publish = false

[dependencies]
jetdb = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
